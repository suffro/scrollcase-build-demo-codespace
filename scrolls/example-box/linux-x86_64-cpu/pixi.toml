# Solved by `scrollcase lock` into pixi.lock, which is committed and reviewed.
# `platforms` must equal the target's conda subdirectory, or the solve produces an environment
# that cannot run on the machine the box is for.
[workspace]
name = "example-box-linux-x86_64-cpu"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
